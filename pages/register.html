<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account — MindBridge</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="../css/style.css"/>

<style>
.goal-btn{
border:2px solid var(--border);
border-radius:12px;
padding:0.75rem;
text-align:center;
cursor:pointer;
transition:all 0.2s;
background:white;
font-size:0.82rem;
}

.goal-btn:hover,
.goal-btn.active{
border-color:var(--brand);
background:var(--teal-light);
color:var(--brand);
}

.goal-btn .gi{
font-size:1.5rem;
display:block;
margin-bottom:4px;
}
</style>

</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
<div class="container">

<a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
<span class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></span>
<span class="brand-text">Mind<span>Bridge</span></span>
</a>

<div class="ms-auto">
<a href="login.html" class="btn btn-outline-brand btn-sm">Log In</a>
</div>

</div>
</nav>

<div class="auth-page" style="padding-top:120px">

<div class="container">

<div class="auth-card" style="max-width:520px">

<div class="text-center mb-4">

<div class="brand-icon mx-auto mb-3" style="width:52px;height:52px;font-size:24px">
<i class="bi bi-heart-pulse-fill"></i>
</div>

<h2>Create Your Account</h2>
<p class="text-muted">Free forever. No credit card needed.</p>

</div>

<!-- PROGRESS -->

<div class="d-flex align-items-center gap-2 mb-4">
<div class="flex-fill" style="height:4px;background:var(--brand)" id="p1"></div>
<div class="flex-fill" style="height:4px;background:var(--border)" id="p2"></div>
<div class="flex-fill" style="height:4px;background:var(--border)" id="p3"></div>
<small class="text-muted" id="stepLabel">Step 1 of 3</small>
</div>

<!-- STEP 1 -->

<div id="step1">

<div class="row g-3">

<div class="col-6">
<label class="form-label">First Name</label>
<input id="firstName" type="text" class="form-control" placeholder="Anjali"/>
</div>

<div class="col-6">
<label class="form-label">Last Name</label>
<input id="lastName" type="text" class="form-control" placeholder="Sharma"/>
</div>

</div>

<div class="mt-3">
<label class="form-label">Email Address</label>
<input id="email" type="email" class="form-control" placeholder="you@example.com"/>
</div>

<div class="mt-3">
<label class="form-label">Password</label>
<input id="password" type="password" class="form-control" placeholder="Min 8 characters"/>
</div>

<button class="btn btn-brand w-100 mt-4" onclick="goStep(2)">
Continue
</button>

</div>

<!-- STEP 2 -->

<div id="step2" style="display:none">

<h6 class="mb-2">What brings you to MindBridge?</h6>

<div class="row g-2">

<div class="col-4">
<button class="goal-btn w-100" onclick="this.classList.toggle('active')">
<span class="gi">😰</span>Anxiety
</button>
</div>

<div class="col-4">
<button class="goal-btn w-100" onclick="this.classList.toggle('active')">
<span class="gi">😔</span>Depression
</button>
</div>

<div class="col-4">
<button class="goal-btn w-100" onclick="this.classList.toggle('active')">
<span class="gi">😤</span>Stress
</button>
</div>

</div>

<div class="d-flex gap-2 mt-4">

<button class="btn btn-ghost" onclick="goStep(1)">
Back
</button>

<button class="btn btn-brand flex-fill" onclick="goStep(3)">
Continue
</button>

</div>

</div>

<!-- STEP 3 -->

<div id="step3" style="display:none">

<h6 class="mb-2">Personalize your plan</h6>

<div class="mb-4 form-check">

<input class="form-check-input" type="checkbox" id="terms" checked/>

<label class="form-check-label" for="terms">
I agree to the Terms and Privacy Policy
</label>

</div>

<div class="d-flex gap-2">

<button class="btn btn-ghost" onclick="goStep(2)">
Back
</button>

<button onclick="registerUser()" class="btn btn-brand flex-fill">
Start My Journey
</button>

</div>

</div>

<p class="text-center mt-4 mb-0">
Already have an account?
<a href="login.html">Log in</a>
</p>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

function goStep(n){

[1,2,3].forEach(i=>{
document.getElementById('step'+i).style.display=i===n?'block':'none'
document.getElementById('p'+i).style.background=i<=n?'var(--brand)':'var(--border)'
})

document.getElementById('stepLabel').textContent=`Step ${n} of 3`

}

async function registerUser(){

const firstName=document.getElementById("firstName").value
const lastName=document.getElementById("lastName").value
const email=document.getElementById("email").value
const password=document.getElementById("password").value

const res=await fetch("http://localhost:5000/api/auth/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
firstName,
lastName,
email,
password
})

})

const data=await res.json()

if(res.ok){

alert("Registration successful")

window.location.href="login.html"

}else{

alert(data.message)

}

}

</script>

</body>
</html>
