<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Log In — MindBridge</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="../css/style.css"/>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
<div class="container">
<a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
<span class="brand-icon"><i class="bi bi-heart-pulse-fill"></i></span>
<span class="brand-text">Mind<span>Bridge</span></span>
</a>

<div class="ms-auto">
<a href="register.html" class="btn btn-outline-brand btn-sm">Create Account</a>
</div>
</div>
</nav>

<!-- LOGIN CARD -->
<div class="auth-page">
<div class="container">
<div class="auth-card">

<div class="text-center mb-4">
<div class="brand-icon mx-auto mb-3" style="width:52px;height:52px;font-size:24px">
<i class="bi bi-heart-pulse-fill"></i>
</div>

<h2>Welcome Back</h2>
<p class="text-muted">Your safe space is waiting for you.</p>
</div>

<!-- EMAIL -->
<div class="mb-3">
<label class="form-label">Email Address</label>
<input id="loginEmail" type="email" class="form-control" placeholder="you@example.com"/>
</div>

<!-- PASSWORD -->
<div class="mb-3">

<div class="d-flex justify-content-between">
<label class="form-label">Password</label>
<a href="#" style="font-size:0.8rem;color:var(--brand)">Forgot password?</a>
</div>

<div class="position-relative">

<input id="loginPassword" type="password" class="form-control" placeholder="Your password"/>

<button onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px">

<i class="bi bi-eye" id="eyeIcon"></i>

</button>

</div>

</div>

<!-- REMEMBER -->
<div class="mb-4 form-check">
<input class="form-check-input" type="checkbox" id="remember"/>
<label class="form-check-label" for="remember" style="font-size:0.875rem">
Remember me for 30 days
</label>
</div>

<!-- LOGIN BUTTON -->
<button onclick="loginUser()" class="btn btn-brand w-100 mb-3">
Log In
</button>

<!-- SOCIAL LOGIN -->
<div class="divider-text mb-3"><span>or continue with</span></div>

<div class="d-flex gap-2 mb-4">
<button class="btn btn-ghost flex-fill">
<i class="bi bi-google me-2"></i>Google
</button>

<button class="btn btn-ghost flex-fill">
<i class="bi bi-apple me-2"></i>Apple
</button>
</div>

<p class="text-center mb-0" style="font-size:0.85rem;color:var(--muted)">
New to MindBridge?
<a href="register.html" style="color:var(--brand);font-weight:500">
Create a free account
</a>
</p>

<div class="mt-4 p-3" style="background:var(--teal-light);border-radius:10px;border-left:4px solid var(--brand)">
<p class="mb-0" style="font-size:0.78rem;color:var(--teal)">
<i class="bi bi-shield-lock me-1"></i>
Your data is encrypted. MindBridge never shares your personal information.
</p>
</div>

</div>
</div>
</div>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- PASSWORD TOGGLE -->
<script>
function togglePwd() {

const f = document.getElementById('loginPassword');
const i = document.getElementById('eyeIcon');

if (f.type === 'password') {
f.type = 'text';
i.className = 'bi bi-eye-slash';
} else {
f.type = 'password';
i.className = 'bi bi-eye';
}

}

window.addEventListener('scroll',()=>{
const n=document.getElementById('mainNav');
if(n) n.classList.toggle('scrolled',window.scrollY>30);
});
</script>

<!-- LOGIN API -->
<script>

async function loginUser(){

const email = document.getElementById("loginEmail").value;
const password = document.getElementById("loginPassword").value;

const res = await fetch("http://localhost:5000/api/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email,
password
})
});

const data = await res.json();

if(res.ok){

localStorage.setItem("token",data.token);

alert("Login successful");

window.location.href="chat.html";

}else{

alert(data.message);

}

}

</script>

</body>
</html>
